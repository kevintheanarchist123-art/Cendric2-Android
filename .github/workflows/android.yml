name: Build Cendric Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with SFML submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK and CMake 3.28+
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          CMAKE_PKG=$($SDKMANAGER --list | grep -oE 'cmake;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          echo "Using $CMAKE_PKG"
          echo "ANDROID_CMAKE_VERSION=${CMAKE_PKG#cmake;}" >> $GITHUB_ENV
          yes | $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "$CMAKE_PKG"

      - name: Package game assets for APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r db res android/app/src/main/assets/
          (cd android/app/src/main/assets && find db res -type f | sort) > android/app/src/main/assets/asset_manifest.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cendric-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
